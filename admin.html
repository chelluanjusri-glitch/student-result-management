
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Admin Dashboard</h1>
    <button onclick="logout()">Logout</button>
</header>

<div class="container" id="loginSection">
    <h2>Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="adminLogin()">Login</button>
    <p id="loginMessage"></p>
</div>

<div class="container" id="dashboard" style="display:none">
    <h2>Add Student Result</h2>

    <input type="text" id="roll" placeholder="Roll Number">
    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="course" placeholder="Course">

    <input type="number" id="mark1" placeholder="Subject 1 Marks" min="0" max="100">
    <input type="number" id="mark2" placeholder="Subject 2 Marks" min="0" max="100">
    <input type="number" id="mark3" placeholder="Subject 3 Marks" min="0" max="100">

    <button onclick="addStudent()" id="saveButton">Add Result</button>

    <h2>Student Records</h2>

    <input type="text" id="searchAdmin"
    placeholder="Search by Roll Number"
    oninput="displayStudents()">

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
